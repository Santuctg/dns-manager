<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DNS Manager</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-shell" data-page="login">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark">DN</span><div><strong>DNS Manager</strong><span>Network control console</span></div></div>
    <div><p class="eyebrow">Secure access</p><h1>Sign in</h1><p class="muted">Use your DNS Manager account to continue.</p></div>
    <form data-login-form data-next="{{ next_path }}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="flash" data-login-error hidden></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
