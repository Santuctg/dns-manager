{% extends "base.html" %}
{% block content %}
<section class="content-stack">
  <div class="toolbar card"><div><p class="muted">Manage operator accounts and access roles.</p></div>{% if can_user_create %}<button class="btn btn-primary" data-action="user-create">Add User</button>{% endif %}</div>
  <section class="card"><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody data-users-table><tr><td colspan="5" class="muted">Loading users…</td></tr></tbody></table></div></section>
</section>
<dialog class="modal" data-user-dialog><form method="dialog" data-user-form><div class="modal-head"><h2 data-user-dialog-title>Add user</h2><button class="icon-btn" type="button" data-dialog-close aria-label="Close">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>Username<input name="username"></label><label>Email<input name="email" type="email"></label><label class="span-2" data-password-field>Password<input name="password" type="password" minlength="12"></label><label class="span-2">Role<select name="role_id" required></select></label><label class="check span-2" data-active-field><input name="is_active" type="checkbox" checked> Account active</label></div><div class="modal-actions"><button class="btn btn-ghost" type="button" data-dialog-close>Cancel</button><button class="btn btn-primary" type="submit" value="default">Save user</button></div></form></dialog>
<dialog class="modal" data-password-dialog><form method="dialog" data-password-form><div class="modal-head"><h2>Reset password</h2><button class="icon-btn" type="button" data-dialog-close aria-label="Close">×</button></div><input type="hidden" name="id"><label>New password<input name="password" type="password" minlength="12" required></label><div class="modal-actions"><button class="btn btn-ghost" type="button" data-dialog-close>Cancel</button><button class="btn btn-danger" type="submit" value="default">Reset password</button></div></form></dialog>
{% endblock %}
