# DNS Manager security boundary: reject requests that do not match a configured
# hostname. This prevents direct-IP and unknown-host browser access while
# leaving explicitly configured HTTP/HTTPS virtual hosts unaffected.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
